openapi: 3.1.0
info:
  title: trade-imports-address-book
  description: Org-scoped address book API for EUDP Live Animals
  version: 1.0.0
security:
- Trade-Imports-Organisation-Id: []
tags:
- name: addresses
  description: Address book, scoped to the caller's organisation
paths:
  /organisation/{orgId}/addresses/{address-id}:
    get:
      tags:
      - addresses
      summary: Fetch one address, including tombstones
      operationId: get-address
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: Trade-Imports-Organisation-Id
        in: header
        required: true
        schema:
          type: string
      - name: address-id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The address (deleted false or true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '404':
          description: Unknown id, or an id outside the caller's organisation scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Trade-Imports-Organisation-Id: []
    put:
      tags:
      - addresses
      summary: Replace an address's mutable fields
      operationId: update-address
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: Trade-Imports-Organisation-Id
        in: header
        required: true
        schema:
          type: string
      - name: address-id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      responses:
        '200':
          description: Updated address with bumped modifiedAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          description: Validation error, or a missing org header
          content:
            application/problem+json:
              schema:
                type: object
                anyOf:
                - $ref: '#/components/schemas/ValidationProblem'
                - $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown id, an id outside the caller's organisation scope, or a tombstone
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Concurrent update conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Trade-Imports-Organisation-Id: []
    delete:
      tags:
      - addresses
      summary: Soft-delete an address (tombstone)
      operationId: delete-address
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: Trade-Imports-Organisation-Id
        in: header
        required: true
        schema:
          type: string
      - name: address-id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Soft-deleted (or already deleted — idempotent)
        '400':
          description: Missing org header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown id, or an id outside the caller's organisation scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Trade-Imports-Organisation-Id: []
  /organisation/{orgId}/addresses:
    get:
      tags:
      - addresses
      summary: List the caller's live addresses (paginated, searchable)
      operationId: list-addresses
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: Trade-Imports-Organisation-Id
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 1-based page number
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: pageSize
        in: query
        description: Addresses a page, from 1 to 100 (default 25)
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 100
          minimum: 1
      - name: q
        in: query
        description: Case-insensitive partial-word search over name, address line 1, address line 2, town or city, county and postcode. An address matching q, a countryCode or a searchRole is returned.
        required: false
        schema:
          type: string
      - name: countryCode
        in: query
        description: ISO alpha-2 country codes. Repeatable. An address in any of them matches the search, as one matching q or a searchRole does.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: role
        in: query
        description: Keeps only addresses holding any of these roles. Repeatable. Narrows the search (q, countryCode and searchRole); an address with no roles never matches. An unknown value is refused with 400.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AddressRole'
      - name: searchRole
        in: query
        description: 'Roles that make an address match the search: an address holding any of them matches, as one matching q or countryCode does. Repeatable. An unknown value is refused with 400.'
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AddressRole'
      responses:
        '200':
          description: One page of the caller's live addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPageResponse'
        '400':
          description: An out-of-range or non-numeric page or page size, an unknown role or search role, or a missing org header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Path orgId does not match the caller's organisation header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Trade-Imports-Organisation-Id: []
    post:
      tags:
      - addresses
      summary: Create an address in the caller's address book
      operationId: create-address
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: Trade-Imports-Organisation-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Absolute URI of the created address
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          description: Validation error, or a missing identity header
          content:
            application/problem+json:
              schema:
                type: object
                anyOf:
                - $ref: '#/components/schemas/ValidationProblem'
                - $ref: '#/components/schemas/Problem'
        '404':
          description: Path orgId does not match the caller's organisation header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Trade-Imports-Organisation-Id: []
components:
  schemas:
    AddressRequest:
      description: Create or replace an address in the caller's address book
      properties:
        name:
          type: string
          description: Display name for the address
          example: Highland Livestock Ltd
          maxLength: 255
          minLength: 0
        addressLine1:
          type: string
          description: First line of the postal address
          example: 14 Drover's Way
          maxLength: 255
          minLength: 0
        addressLine2:
          type: string
          description: Second line of the postal address
          maxLength: 255
          minLength: 0
        townOrCity:
          type: string
          description: Town or city
          example: Inverness
          maxLength: 100
          minLength: 0
        county:
          type: string
          description: County or region
          maxLength: 100
          minLength: 0
        postcode:
          type: string
          description: Postal or ZIP code
          example: IV2 3JH
          maxLength: 12
          minLength: 0
        countryCode:
          type: string
          description: Country code (stored as given). GB when the address holds a CONSIGNEE, IMPORTER or PLACE_OF_DESTINATION role
          example: GB
          minLength: 1
        phone:
          type: string
          description: Contact telephone number
          example: +44 1463 234567
          maxLength: 20
          minLength: 0
        email:
          type: string
          description: Contact email address
          example: exports@highlandlivestock.example.com
          maxLength: 254
          minLength: 0
        roles:
          type: array
          description: 'The roles a notification can choose this address for. Duplicates collapse. Every role must come from one group: sending (PLACE_OF_ORIGIN, CONSIGNOR), receiving (CONSIGNEE, IMPORTER, PLACE_OF_DESTINATION) or branch (BRANCH_ADDRESS)'
          items:
            $ref: '#/components/schemas/AddressRole'
          minItems: 1
      required:
      - addressLine1
      - countryCode
      - email
      - name
      - phone
      - postcode
      - roles
      - townOrCity
    AddressRole:
      type: string
      description: 'A role a notification can choose this address for: a party, or a place'
      enum:
      - PLACE_OF_ORIGIN
      - CONSIGNOR
      - PLACE_OF_DESTINATION
      - CONSIGNEE
      - IMPORTER
      - BRANCH_ADDRESS
    AddressResponse:
      description: An address in the caller's organisation-scoped address book
      properties:
        id:
          type: string
          description: Opaque address identifier
          example: 665f1c2ab3e4d51a2c9d0e77
        name:
          type: string
          description: Display name
        addressLine1:
          type: string
          description: First line of the postal address
        addressLine2:
          type: string
          description: Second line of the postal address
        townOrCity:
          type: string
          description: Town or city
        county:
          type: string
          description: County or region
        postcode:
          type: string
          description: Postal or ZIP code
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: GB
        phone:
          type: string
          description: Contact telephone number
        email:
          type: string
          description: Contact email address
        roles:
          type: array
          description: The roles a notification can choose this address for; empty when it has none
          items:
            $ref: '#/components/schemas/AddressRole'
        organisationId:
          type: string
          description: Organisation that owns this address
        deleted:
          type: boolean
          description: True when the address has been soft-deleted
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        modifiedAt:
          type: string
          format: date-time
          description: Last modification timestamp (UTC)
      required:
      - addressLine1
      - countryCode
      - createdAt
      - deleted
      - email
      - id
      - modifiedAt
      - name
      - organisationId
      - phone
      - postcode
      - townOrCity
    ValidationProblem:
      description: RFC 9457 validation problem with field errors
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - errors
      - status
      - title
      - type
    Problem:
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        traceId:
          type: string
      required:
      - status
      - title
      - type
    AddressPageResponse:
      description: Paginated list of live addresses (never a bare array)
      properties:
        items:
          type: array
          description: Addresses on this page
          items:
            $ref: '#/components/schemas/AddressResponse'
        page:
          type: integer
          format: int32
          description: Current 1-based page number
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 'Page size served: the requested one, else the default'
          minimum: 1
        totalItems:
          type: integer
          format: int32
          description: Total number of matching addresses
          minimum: 0
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - totalItems
      - totalPages
  securitySchemes:
    Trade-Imports-Organisation-Id:
      type: apiKey
      description: Caller organisation id from the trusted forwarded header; must match path orgId
      name: Trade-Imports-Organisation-Id
      in: header
